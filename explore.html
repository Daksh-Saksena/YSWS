<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trek</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/project.css">
    <style>
        .projects-dashboard-wrap {
            max-width: 1120px;
            width: 100%;
            margin: 40px auto 60px auto;
            padding: 0 24px;
            box-sizing: border-box;
        }

        .dashboard-header {
            margin-bottom: 32px;
        }

        .dashboard-title {
            font-family: var(--hc-font-heading);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--hc-white);
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .dashboard-sub {
            color: var(--hc-muted);
            font-size: 1.05rem;
            margin: 0;
            max-width: 600px;
            line-height: 1.4;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            padding: 12px 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--hc-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--hc-smoke);
        }

        .tab.active {
            color: var(--hc-white);
            border-bottom: 3px solid var(--hc-red);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Explore Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .project-card {
            background: rgba(23, 23, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: rgba(236, 55, 80, 0.6);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        }

        .project-card-cover-wrap {
            position: relative;
            width: 100%;
            height: 160px;
            background: #121217;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-card-cover {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 16px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        .project-card:hover .project-card-cover {
            transform: scale(1.06);
        }

        .project-card-badges {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .project-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .project-card-name {
            font-family: var(--hc-font-heading);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--hc-white);
            margin: 0 0 6px 0;
            line-height: 1.3;
        }

        .project-card-tagline {
            color: var(--hc-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0 0 16px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .project-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .author-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .author-name {
            font-size: 0.9rem;
            color: var(--hc-smoke);
            font-weight: 600;
        }

        /* Leaderboard */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lb-row {
            display: flex;
            align-items: center;
            background: rgba(23, 23, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 24px;
            transition: all 0.2s ease;
        }

        .lb-row:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 30, 38, 0.9);
        }

        .lb-rank {
            font-family: var(--hc-font-heading);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--hc-muted);
            width: 40px;
        }

        .lb-row:nth-child(1) .lb-rank { color: #ffd700; }
        .lb-row:nth-child(2) .lb-rank { color: #c0c0c0; }
        .lb-row:nth-child(3) .lb-rank { color: #cd7f32; }

        .lb-user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .lb-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .lb-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--hc-white);
        }

        .lb-stats {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .lb-stat-block {
            text-align: right;
        }

        .lb-stat-val {
            font-family: var(--hc-font-heading);
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--hc-white);
        }

        .lb-stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--hc-muted);
        }

        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 140, 0, 0.15);
            border: 1px solid rgba(255, 140, 0, 0.3);
            color: #ffa500;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-wrap: wrap;
                gap: 10px;
            }
            .lb-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                position: relative;
            }
            .lb-stats {
                width: 100%;
                justify-content: flex-start;
                gap: 20px;
                margin-top: 4px;
                flex-wrap: wrap;
            }
            .lb-rank {
                position: absolute;
                top: 16px;
                right: 24px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="trek-app">
    <!-- Top Navigation Bar -->
    <nav class="trek-nav">
        <div class="trek-nav-left">
            <a href="index.html" class="trek-nav-brand">
                <span style="font-size: 1.05rem; font-weight: 700; color: var(--hc-smoke);">← Go Back to</span>
                <img src="images/logo.png" alt="Trek Logo" class="trek-nav-logo">
            </a>
            <div class="trek-nav-links">
                <a href="projects.html" class="trek-nav-link">Projects</a>
                <a href="explore.html" class="trek-nav-link active">Explore</a>
                <a href="docs.html" class="trek-nav-link">Docs</a>
                <a href="shop.html" class="trek-nav-link">Shop</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="projects-dashboard-wrap">
        <div class="dashboard-header">
            <h1 class="dashboard-title">Explore Trek</h1>
            <p class="dashboard-sub">Discover hardware projects being built around the world and see who's logging the most hours.</p>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="explore-tab">Global Projects</div>
            <div class="tab" data-tab="leaderboard-tab">Leaderboard</div>
        </div>

        <!-- Explore Projects Tab -->
        <div id="explore-tab" class="tab-content active">
            <div class="projects-grid" id="explore-grid">
                <div style="color: var(--hc-muted); padding: 30px; text-align: center; grid-column: 1 / -1;">Loading public projects...</div>
            </div>
        </div>

        <!-- Leaderboard Tab -->
        <div id="leaderboard-tab" class="tab-content">
            <div class="leaderboard-list" id="leaderboard-list">
                <div style="color: var(--hc-muted); padding: 30px; text-align: center;">Loading leaderboard...</div>
            </div>
        </div>
    </main>

    <!-- Script: Explore Controller -->
    <script type="module">
        import { api } from './js/api.js?v=6';

        class ExploreDashboard {
            constructor() {
                this.data = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadData();
            }

            bindEvents() {
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        // Remove active class from all
                        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        
                        // Add active class to clicked
                        const targetId = tab.dataset.tab;
                        tab.classList.add('active');
                        document.getElementById(targetId)?.classList.add('active');
                    });
                });
            }

            resolveAsset(url) {
                if (!url) return 'images/flag.png';
                if (typeof api?.resolveAssetUrl === 'function') {
                    return api.resolveAssetUrl(url);
                }
                return url;
            }

            escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            async loadData() {
                try {
                    this.data = await api.getExploreData();
                    this.renderProjects();
                    this.renderLeaderboard();
                } catch (err) {
                    console.error('Failed to load explore data', err);
                    document.getElementById('explore-grid').innerHTML = `<div style="color: #ff6b81; grid-column: 1/-1;">Error loading projects.</div>`;
                    document.getElementById('leaderboard-list').innerHTML = `<div style="color: #ff6b81;">Error loading leaderboard.</div>`;
                }
            }

            renderProjects() {
                const grid = document.getElementById('explore-grid');
                if (!this.data || !this.data.projects || this.data.projects.length === 0) {
                    grid.innerHTML = `<div style="color: var(--hc-muted); text-align: center; grid-column: 1/-1;">No public projects found yet.</div>`;
                    return;
                }

                grid.innerHTML = this.data.projects.map(p => {
                    const coverImg = this.resolveAsset(p.cover_image_url || api.getDefaultCover(p.guild));
                    const avatarImg = this.resolveAsset(p.author_avatar || 'images/flag.png');
                    const guildName = (p.guild || 'frontier').toUpperCase();

                    return `
                        <div class="project-card">
                            <div class="project-card-cover-wrap">
                                <img src="${coverImg}" alt="${this.escapeHtml(p.name)}" class="project-card-cover">
                                <div class="project-card-badges">
                                    <span class="status-pill" style="background: rgba(0,0,0,0.65); border-color: rgba(255,255,255,0.2); color: var(--hc-smoke);">${guildName} GUILD</span>
                                </div>
                            </div>
                            <div class="project-card-body">
                                <h3 class="project-card-name">${this.escapeHtml(p.name)}</h3>
                                <p class="project-card-tagline">${this.escapeHtml(p.tagline || 'Documenting physical build progress on Trek')}</p>
                                
                                <div class="project-author">
                                    <img src="${avatarImg}" alt="Avatar" class="author-avatar">
                                    <div class="author-name">${this.escapeHtml(p.author_name || 'Trek Builder')}</div>
                                    <div style="margin-left: auto; font-size: 0.85rem; color: var(--hc-smoke); font-weight: 600;">
                                        ${parseFloat(p.total_hours) || 0}h
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderLeaderboard() {
                const list = document.getElementById('leaderboard-list');
                if (!this.data || !this.data.leaderboard || this.data.leaderboard.length === 0) {
                    list.innerHTML = `<div style="color: var(--hc-muted); text-align: center;">No users found yet.</div>`;
                    return;
                }

                list.innerHTML = this.data.leaderboard.map((u, i) => {
                    const avatarImg = this.resolveAsset(u.avatar_url || 'images/flag.png');
                    const streakBadge = u.streak > 0 
                        ? `<div class="streak-badge">🔥 ${u.streak} Day${u.streak > 1 ? 's' : ''}</div>` 
                        : '';

                    return `
                        <div class="lb-row">
                            <div class="lb-rank">#${i + 1}</div>
                            <div class="lb-user-info">
                                <img src="${avatarImg}" class="lb-avatar" alt="Avatar">
                                <div class="lb-name">${this.escapeHtml(u.display_name || 'Trek Builder')}</div>
                                ${streakBadge}
                            </div>
                            <div class="lb-stats">
                                <div class="lb-stat-block">
                                    <div class="lb-stat-val">${parseFloat(u.total_hours) || 0}</div>
                                    <div class="lb-stat-label">Hours Logged</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ExploreDashboard();
        });
    </script>
</body>

</html>
